name: Build iOS app

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project HelloWorld.xcodeproj -target HelloWorld \
            -configuration Release -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO build
          cd build/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/HelloWorld-simulator.zip" HelloWorld.app

      - name: Build for iOS device (unsigned)
        run: |
          xcodebuild -project HelloWorld.xcodeproj -target HelloWorld \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Release-iphoneos/HelloWorld.app Payload/
          zip -qry HelloWorld-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-simulator
          path: HelloWorld-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-unsigned-ipa
          path: HelloWorld-unsigned.ipa
